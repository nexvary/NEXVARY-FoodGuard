name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: foodguard-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: Build / Test / Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-FoodGuard-enterprise-rc2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  enterprise-ui-rtl-gate:
    name: Enterprise UI / RTL Gate
    needs: build-test-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download tested APK
        uses: actions/download-artifact@v5
        with:
          name: NEXVARY-FoodGuard-enterprise-rc2-debug
          path: qa-apk

      - name: Boot lightweight emulator and verify real UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          cores: 2
          emulator-boot-timeout: 1500
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: |
            set -eu
            PACKAGE="com.nexvary.foodguard"
            ACTIVITY="com.nexvary.foodguard/.MainActivity"
            APK="qa-apk/app-debug.apk"

            adb install -r "$APK"
            adb shell settings put system font_scale 1.0

            wait_for_ui() {
              expected="$1"
              xml="$2"
              ready=0
              for _ in $(seq 1 60); do
                adb shell uiautomator dump /sdcard/foodguard-window.xml >/dev/null 2>&1 || true
                adb shell cat /sdcard/foodguard-window.xml > "$xml" 2>/dev/null || true
                if grep -Fq "$expected" "$xml"; then
                  ready=1
                  break
                fi
                sleep 2
              done
              if [ "$ready" -ne 1 ]; then
                echo "::error::FoodGuard enterprise UI did not render expected text: $expected"
                adb shell dumpsys activity top | head -n 220 || true
                adb logcat -d -t 500 || true
                exit 1
              fi
            }

            set_app_locale() {
              locale="$1"
              adb shell cmd locale set-app-locales "$PACKAGE" --user current --locales "$locale"
              adb shell am force-stop "$PACKAGE"
              adb shell am start -W -n "$ACTIVITY"
            }

            set_app_locale "en-US"
            wait_for_ui "NEXVARY" enterprise-home-en.xml
            grep -Fq "FOOD SAFETY OPERATIONS" enterprise-home-en.xml
            adb exec-out screencap -p > enterprise-home-en.png
            test -s enterprise-home-en.png

            set_app_locale "ar-EG"
            wait_for_ui "NEXVARY" enterprise-home-ar.xml
            if ! grep -Eq "فحص|دليل|السجل|قائمة المراقبة" enterprise-home-ar.xml; then
              echo "::error::Arabic locale did not render Arabic enterprise content"
              cat enterprise-home-ar.xml
              exit 1
            fi
            adb exec-out screencap -p > enterprise-home-ar.png
            test -s enterprise-home-ar.png

            adb shell cmd locale set-app-locales "$PACKAGE" --user current --locales ""

      - name: Upload bilingual screenshots and UI hierarchies
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-FoodGuard-enterprise-rc2-screenshots
          path: |
            enterprise-home-en.png
            enterprise-home-ar.png
            enterprise-home-en.xml
            enterprise-home-ar.xml
          if-no-files-found: error
          retention-days: 14
