name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: foodguard-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    name: Build / Test / Lint
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-FoodGuard-enterprise-rc2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Google Play AAB
        run: gradle :app:bundleRelease --stacktrace

      - name: Upload Google Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-FoodGuard-Google-Play-AAB
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  enterprise-ui-rtl-gate:
    name: Enterprise UI / RTL Gate
    needs: build-test-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Download tested APK
        uses: actions/download-artifact@v5
        with:
          name: NEXVARY-FoodGuard-enterprise-rc2-debug
          path: qa-apk

      - name: Enable KVM access when available
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          fi

      - name: Create visual QA script
        shell: bash
        run: |
          cat > foodguard-visual-qa.sh <<'EOF'
          #!/usr/bin/env sh
          set -eu
          PACKAGE="com.nexvary.foodguard"
          ACTIVITY="com.nexvary.foodguard/.MainActivity"
          APK="qa-apk/app-debug.apk"

          adb install -r "$APK"
          adb shell settings put system font_scale 1.0

          wait_for_ui() {
            expected="$1"
            xml="$2"
            ready=0
            for _ in $(seq 1 60); do
              adb shell uiautomator dump /sdcard/foodguard-window.xml >/dev/null 2>&1 || true
              adb shell cat /sdcard/foodguard-window.xml > "$xml" 2>/dev/null || true
              if grep -Fq "$expected" "$xml"; then
                ready=1
                break
              fi
              sleep 2
            done
            if [ "$ready" -ne 1 ]; then
              echo "FoodGuard enterprise UI did not render expected text: $expected" >&2
              adb shell dumpsys activity top | head -n 220 || true
              adb logcat -d -t 500 || true
              exit 1
            fi
          }

          set_app_locale() {
            locale="$1"
            adb shell cmd locale set-app-locales "$PACKAGE" --user current --locales "$locale"
            adb shell am force-stop "$PACKAGE"
            adb shell am start -W -n "$ACTIVITY"
          }

          set_app_locale "en-US"
          wait_for_ui "NEXVARY" enterprise-home-en.xml
          if grep -Fq "Main menu" enterprise-home-en.xml; then echo "Obsolete Main menu heading still present" >&2; exit 1; fi
          grep -Fq "Inspect food" enterprise-home-en.xml
          grep -Fq "About" enterprise-home-en.xml
          adb exec-out screencap -p > enterprise-home-en.png
          test -s enterprise-home-en.png

          set_app_locale "ar-EG"
          wait_for_ui "NEXVARY" enterprise-home-ar.xml
          if ! grep -Eq "فحص الطعام|دليل الأغذية|سجل الفحوصات|عنا" enterprise-home-ar.xml; then
            echo "Arabic locale did not render Arabic enterprise content" >&2
            cat enterprise-home-ar.xml
            exit 1
          fi
          adb exec-out screencap -p > enterprise-home-ar.png
          test -s enterprise-home-ar.png

          # Capture every primary Arabic screen and key secondary pages.
          tap_text() {
            label="$1"; out="$2"
            adb shell uiautomator dump /sdcard/nav.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/nav.xml > nav.xml
            bounds=$(grep -o 'text="'"$label"'"[^>]*bounds="\[[0-9,]*\]\[[0-9,]*\]"' nav.xml | head -1 | sed -n 's/.*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p')
            set -- $bounds
            [ "$#" -eq 4 ] || { echo "Cannot find navigation label: $label" >&2; exit 1; }
            adb shell input tap $((($1+$3)/2)) $((($2+$4)/2))
            sleep 2
            adb exec-out screencap -p > "$out"
            test -s "$out"
          }
          tap_text "الدليل" enterprise-catalog-ar.png
          tap_text "افحص الطعام" enterprise-scanner-ar.png
          tap_text "السجل" enterprise-history-ar.png
          tap_text "الإعدادات" enterprise-settings-ar.png
          tap_text "الرئيسية" enterprise-home-return-ar.png

          # Emergency and About are below the first viewport: swipe, dump, then capture.
          adb shell input swipe 540 1750 540 650 350
          sleep 1
          adb shell uiautomator dump /sdcard/home.xml >/dev/null 2>&1 || true
          adb shell cat /sdcard/home.xml > home.xml
          for pair in "الطوارئ والإسعافات الأولية:enterprise-emergency-ar.png" "عنا:enterprise-about-ar.png"; do
            label=${pair%%:*}; out=${pair#*:}
            bounds=$(grep -o 'text="'"$label"'"[^>]*bounds="\[[0-9,]*\]\[[0-9,]*\]"' home.xml | head -1 | sed -n 's/.*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p')
            [ -n "$bounds" ] || { echo "Cannot find home card: $label" >&2; exit 1; }
            set -- $bounds
            adb shell input tap $((($1+$3)/2)) $((($2+$4)/2))
            sleep 2
            adb exec-out screencap -p > "$out"
            test -s "$out"
            adb shell input keyevent 4
            sleep 1
            adb shell input swipe 540 1750 540 650 350
            sleep 1
            adb shell uiautomator dump /sdcard/home.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/home.xml > home.xml
          done

          adb shell cmd locale set-app-locales "$PACKAGE" --user current --locales ""
          EOF
          chmod +x foodguard-visual-qa.sh

      - name: Boot lightweight emulator and verify real UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          cores: 2
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: sh foodguard-visual-qa.sh

      - name: Upload bilingual screenshots and UI hierarchies
        uses: actions/upload-artifact@v4
        with:
          name: NEXVARY-FoodGuard-enterprise-rc2-screenshots
          path: |
            enterprise-home-en.png
            enterprise-home-ar.png
            enterprise-home-en.xml
            enterprise-home-ar.xml
            enterprise-catalog-ar.png
            enterprise-scanner-ar.png
            enterprise-history-ar.png
            enterprise-settings-ar.png
            enterprise-home-return-ar.png
            enterprise-emergency-ar.png
            enterprise-about-ar.png
          if-no-files-found: error
          retention-days: 14
